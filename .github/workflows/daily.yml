name: 매일 북한 브리핑

on:
  # GitHub started the "30 22" (07:30 KST) cron at 09:49 KST on 2026-09-15; its
  # docs say schedule runs are delayed under load, worst at the top of the hour,
  # and may be dropped. So: fire early at an off-peak minute and let run.py wait
  # for 07:30 (NK_SEND_AT), plus a later fallback that skips if today went out.
  schedule:
    - cron: "43 20 * * *"          # UTC 20:43 = KST 05:43, waits until 07:30
    - cron: "13 23 * * *"          # UTC 23:13 = KST 08:13, fallback: skipped if already sent
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

permissions:
  contents: write                  # store/ 를 되써 넣는다

# 같은 그룹에서 대기 중인 실행은 하나만 남는다. 05:43 실행이 07:30까지 기다리는
# 동안 수동 실행을 넣으면 08:13 예비 실행이 대기열에서 밀려날 수 있으니,
# 05:40~08:30 KST에는 손으로 돌리지 말 것.
concurrency:
  group: briefing                  # 손으로 돌린 실행과 예약 실행이 원장을 동시에 쓰지 않게
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150           # up to ~107 min of waiting for 07:30, then the run

    steps:
      - uses: actions/checkout@v5
        with:
          # the branch tip when the job starts, not the commit at trigger time:
          # the fallback run queues behind the first and must see its metrics row
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성·발행
        run: python run.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Cloudflare answers runners with a 403 challenge whatever the headers
          # (2026-09-14); from home the feed is 200. Off here, on locally.
          NK_SKIP_SOURCES: DailyNK-JP
          TZ: Asia/Seoul
          # scheduled runs only; a manual run starts at once and always runs
          NK_SEND_AT: ${{ github.event_name == 'schedule' && '07:30' || '' }}
          NK_ONCE_A_DAY: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-${{ github.run_number }}
          path: store/
          retention-days: 30

      # published.json 이 저장소에 남아야 다음 실행이 어제 낸 기사를 다시 안 싣는다.
      # 실패로 끝난 실행도 커밋한다(peer review 2026-09-15): 카드를 보낸 뒤 exit 1로
      # 끝나면 원장이 안 올라가 08:13 예비 실행이 같은 카드를 다시 보냈다.
      # 실패·충돌 행도 여기서 올라가야 scorecard 경보가 Actions 장애를 본다.
      - name: 기록 커밋
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name "nk-briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store/
          git diff --cached --quiet && exit 0
          git commit -m "store: $(TZ=Asia/Seoul date +%F)"
          # main may have moved since checkout; a lost push loses the ledger
          # and tomorrow repeats today's articles, so rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            # a conflicted rebase stays in progress and would fail every retry
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::store/ push failed 3 times -- published.json not saved"
          exit 1
