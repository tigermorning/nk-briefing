# 북한 브리핑의 "내용"만 모은 파일. 파이썬을 열지 않고 여기만 고친다.
# graph.py 가 시작할 때 읽고, 칸이 빠졌거나 모양이 틀리면 실행 전에 멈춘다 (모양: briefing_cfg.py).

# 디스코드 발행 이름과 카드 제목 ("🗞️ 날짜 · 북한 브리핑")
제목: "북한 브리핑"
# 초안 프롬프트 첫 문장 "당신은 {기자역할}입니다."
기자역할: "북한 뉴스 브리핑 기자"
# 검수 프롬프트의 "다음은 모두 문제입니다" 목록에 한 줄로 들어간다
주장_주의: "원문이 북한 매체의 주장으로 전하는 내용을 사실처럼 단정"
# 경쟁 없이 한 칸을 여는 공식 자료. 지금은 통일부 북한동향만 있고, 없는 브리핑은 이 줄을 뺀다
1차칸: "통일부"

독자:
  누구: "북한 소식을 매일 챙겨 보지만 여러 매체를 돌 시간은 없는 한국어 독자"
  이미_아는_것: "남북관계 기본 구도, 김정은 체제, 대북제재가 있다는 사실"

# 선별 프롬프트(예선·본선)에 그대로 들어간다. 위에 있을수록 우선.
# 기사 하나를 보고 예/아니오로 답할 수 있는 질문이어야 한다.
# "의미 있는 소식" 같은 인상 말고, 실제로 일어난 일을 묻는다.
중요도_기준:
  - "미사일 발사·핵시설 가동·병력 이동 같은 북한의 군사 행동이 실제로 있었나"
  - "북한 지도부의 인사·정책 결정이나 대외 노선 변화가 공식 발표로 확인됐나"
  - "한국·미국·중국·러시아·일본 정부가 북한 관련 조치(제재·회담·합의)를 실제로 발표했나"
  - "북한 내부의 물가·식량·통제 상황이 현지 소식통이나 조사로 새로 확인됐나"

# 구체적인 유형으로 적는다. 같은 사건 중복은 여기가 아니라 코드(event 라벨)가 막는다.
# 중요도 기준에 억지로 끼워 맞춰지는 기사는 여기서 막아야 한다. 2026-09-14 공원 스케치 기사에
# "기준 번호를 대라, 없으면 0"을 시켜 봤지만 2회 모두 기준 4(내부 상황)를 댔고, 아래 마지막 줄을 넣자 후보에도 안 올랐다.
버릴_것:
  - "조선중앙통신·노동신문 보도를 옮기기만 하고 한국·외국 쪽 확인이나 새 사실이 없는 기사"
  - "친선국 축전·기념일 행사·참배처럼 해마다 같은 날 반복되는 의례 보도"
  - "전문가 전망·가능성 분석만 있고 새로 일어난 일이 없는 기사"
  - "지도자 일가의 체중·외모·건강·자녀 존재에 대한 추측 기사"
  - "날씨·계절·여가·거리 풍경처럼 주민 생활의 분위기만 전하고 물가·식량·통제의 새 변화가 없는 스케치 기사"

# 취재 단계가 기사마다 토픽 하나를 붙이고, 그 토픽의 데스크지침을 따른다.
# 색은 디스코드 카드 왼쪽 띠 색이다.
토픽:
  - 이름: "군사·핵"
    데스크지침: "발사체 종류·발사 지점·비행거리는 원문에 있을 때만 숫자로 적고, 없으면 쓰지 말 것"
    색: "#8F2D2D"
  - 이름: "대외·외교"
    데스크지침: "누가 누구에게 무엇을 발표했는지 주체를 반드시. 북한 발표와 상대국 발표를 섞지 말 것"
    색: "#0B6E77"
  - 이름: "대남"
    데스크지침: "북한 측 표현을 옮길 땐 따옴표로 묶어 누구의 주장인지 드러낼 것"
    색: "#4C7C9C"
  - 이름: "내부 정치"
    데스크지침: "인사는 직책과 이전 직책을 함께. 추정이면 추정이라고 적을 것"
    색: "#6A4A9C"
  - 이름: "경제·사회"
    데스크지침: "가격·환율은 지역과 조사 시점을 함께 적을 것"
    색: "#2E7D5B"
  - 이름: "인권·탈북"
    데스크지침: "개인을 특정할 수 있는 정보(실명·거주지)는 원문에 있어도 쓰지 말 것"
    색: "#8F5606"

# 수집 순서가 곧 선별 목록 순서다. 순서를 바꾸면 선별 결과가 달라질 수 있다.
# 칸: 속보(매일 경쟁) / 심층(7일 창, 하루 최대 1건, 속보와 경쟁 안 함)
# 매일기대: 24시간에 기사가 0이면 SILENT 경보를 낼 소스.
#   38North는 주간이라 0이 소식이고, 연합의 0은 경보다.
# 언어: 본문 위에 모델에게 알려 줄 언어. 비우면 앞 500자에 한글이 없을 때 "외국어"
# 키워드: 북한 전용이 아닌 피드. 제목이나 요약에 이 중 하나가 있어야 남긴다
# 피드본문: 피드의 content:encoded가 기사 전문이라, 페이지가 막히면 대신 쓴다.
#   발췌문이 아닌지 재 본 뒤에만 켠다 (graph.get_body)
소스:
  - 이름: "Yonhap-NK"
    주소: "https://www.yna.co.kr/rss/northkorea.xml"
    칸: 속보
    매일기대: true
  - 이름: "DailyNK"
    주소: "https://www.dailynk.com/feed"
    칸: 속보
    매일기대: true
  # 2026-09-15 러너에서 기사 페이지마다 Cloudflare 챌린지(403), 피드는 200이고
  # 전문(8건 중 8건, 페이지 추출의 0.89~1.35배)이 들어 있다
  - 이름: "38North"
    주소: "https://www.38north.org/feed/"
    칸: 심층
    매일기대: false
    언어: "영어"
    피드본문: true
  - 이름: "RFA-KO"
    주소: "https://www.rfa.org/korean/rss2.xml"
    칸: 속보
    매일기대: false
  # 2026-09-14 probe_sources.py: 외국 후보 21곳 중 이 둘만 한국어 피드에 없는 사건
  # (데일리NK재팬 72시간 4건 중 3건)이나 다른 곳에 없는 보도(아시아프레스 물가 조사)를 가져왔다.
  # 데일리NK재팬은 하루 2건 안팎이라 0인 날이 경보는 아니다.
  - 이름: "DailyNK-JP"
    주소: "https://dailynk.jp/feed"
    칸: 속보
    매일기대: false
    언어: "일본어"
    키워드: ["北朝鮮", "金正恩", "平壌", "朝鮮民主主義"]
  # 일본 국내 기사도 섞여 있다(측정 16건 중 5건). index.xml 없는 /apn/feed/는
  # 200에 한 줄짜리 meta-refresh 페이지와 0건을 준다.
  - 이름: "AsiaPress"
    주소: "https://www.asiapress.org/apn/feed/index.xml"
    칸: 심층
    매일기대: false
    언어: "일본어"
    키워드: ["北朝鮮", "金正恩", "平壌", "朝鮮民主主義"]
